# Merge these locations into the EXISTING TLS server block for panvibes.com.
# This port-80 example is for initial setup; retain Certbot/HTTPS configuration.
# On Ubuntu nginx 1.24, use `listen 443 ssl http2;` in the existing TLS block.
server {
    listen 80;
    server_name panvibes.com www.panvibes.com;
    root /srv/panvibes/current/public;

    # Nginx serves video directly with Content-Length and byte-range (206)
    # support. Never proxy MP4 through an application/transcoding endpoint.
    location ~ ^/media/home-hero/hero-web-.*\.mp4$ {
        try_files $uri =404;
        types { video/mp4 mp4; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        sendfile on;
        tcp_nopush on;
        gzip off;
    }
    location ~ ^/(images|media|documents|assets)/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    location /_next/static/ {
        alias /srv/panvibes/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # Compress text/JS, not already-compressed MP4, AVIF or WebP data.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow Next.js streamed responses; do not cache admin or enquiry APIs.
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
